<!DOCTYPE html>

<html>

<head>

```
<title>EcoTrackAI - QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

    body {
        font-family: Arial;
        margin: 0;
        background: #f2f7f3;
        text-align: center;
    }

    nav {
        background: #1b5e20;
        padding: 15px;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin: 0 15px;
        font-weight: bold;
    }

    header {
        background: #2e7d32;
        color: white;
        padding: 25px;
    }

    .container {
        width: 500px;
        max-width: 90%;
        margin: 30px auto;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 2px 10px #ccc;
    }

    #reader {
        width: 100%;
        margin: auto;
    }

    button {
        background: #2e7d32;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 6px;
        cursor: pointer;
        margin: 10px;
    }

    #result {
        margin-top: 20px;
        font-size: 17px;
    }

</style>
```

</head>

<body>

<nav>

```
<a href="/">🏠 Home</a>

<a href="/dashboard">📊 Dashboard</a>

<a href="/waste">🤖 AI Classification</a>

<a href="/ewaste">♻️ E-Waste</a>

<a href="/scanner">📱 Scanner</a>
```

</nav>

<header>

```
<h1>🌱 EcoTrackAI</h1>

<p>QR Waste & E-Waste Scanner</p>
```

</header>

<div class="container">

```
<h2>📱 Scan QR Code</h2>

<p>Scan the QR code attached to waste/e-waste.</p>

<div id="reader"></div>

<div id="result"></div>
```

</div>

<script>

let scannerStarted = false;


function onScanSuccess(decodedText) {

    if (scannerStarted) {

        scannerStarted = false;

        document.getElementById("result").innerHTML =
            "⏳ Reading asset information...";

        fetchAsset(decodedText);

    }

}


async function fetchAsset(qrData) {

    try {

        let assetCode = qrData.split("/").pop();

        const response =
            await fetch("/api/ewaste/" + assetCode);

        const asset =
            await response.json();


        if (asset.error) {

            document.getElementById("result").innerHTML =
                "❌ Asset not found.";

            return;

        }


        document.getElementById("result").innerHTML = `

            <h3>♻️ Asset Found</h3>

            <p><b>Asset ID:</b> ${asset.asset_code}</p>

            <p><b>Device:</b> ${asset.device_name}</p>

            <p><b>Category:</b> ${asset.category}</p>

            <p><b>Status:</b> ${asset.lifecycle_status}</p>

            <button onclick="giveCredits('${asset.asset_code}')">

                ✅ Verify Disposal +50 Credits

            </button>

        `;

    }

    catch (error) {

        document.getElementById("result").innerHTML =
            "❌ Unable to read asset.";

    }

}


async function giveCredits(assetCode) {

    const response = await fetch(

        "/credits/add" +
        "?user_name=Bhumika" +
        "&action=E-Waste%20Recycling" +
        "&points=50",

        {
            method: "POST"
        }

    );


    const data = await response.json();


    document.getElementById("result").innerHTML = `

        <h3>✅ Disposal Verified!</h3>

        <p>Asset: ${assetCode}</p>

        <p>🌱 <b>+50 Green Credits</b></p>

        <a href="/dashboard">

            View Dashboard

        </a>

    `;

}


const qrScanner =
    new Html5QrcodeScanner(

        "reader",

        {
            fps: 10,
            qrbox: 250
        }

    );


qrScanner.render(

    onScanSuccess,

    () => {}

);

scannerStarted = true;

</script>

</body>

</html>
